function backupStatus(){

  if(!start){start=Date.now();try{localStorage.setItem(BACKUP_START_KEY,String(start))}catch(e){}}

  return {last,due:db.magos.length>0&&Date.now()-base>=WEEK_MS};
}

 no hay trucos registrados.</div>'}</div><div class="panel"><h3>📝 Observaciones</h3><textarea id="notasMago" placeholder="Notas breves sobre este mago...">${esc(m.notas||'')}</textarea><button class="btn smallbtn" data-act="saveNotas">Guardar observaciones</button></div><div class="panel"><h3>🏅 Historial de grados</h3>${m.historial.length?m.historial.slice().reverse().map(h=>`<div class="entry">${esc(GRADES[h.grado])} <span class="muted">· ${fmt(h.fecha)}</span></div>`).join(''):'<p class="muted">Aún no hay ascensos registrados.</p>'}<h3 style="margin-top:14px">🎁 Sorteos ganados</h3>${wins.length?wins.map(s=>`<div class="entry">${esc(s.nombre)} · ${esc(s.premio)} <span class="muted">(${fmt(s.fecha)})</span></div>`).join(''):'<p class="muted">Sin premios registrados.</p>'}</div>`}

if(page==='home')html+=backupReminder();
if(page==='ajustes'){html=header('Mis datos','home')+`<div class="panel gold"><h3>💾 Copias de seguridad</h3>${backupReminder()}<p class="notice">Los datos se guardan en este navegador y en este dispositivo. Exporta copias periódicamente: borrar los datos del navegador o cambiar de móvil puede hacerlos desaparecer.</p><button class="btn primary full" data-act="export">⬇ Exportar todos los datos (.json)</button><p class="notice">${backupStatus().last?'Última exportación iniciada: '+new Date(backupStatus().last).toLocaleDateString('es-ES'):'Todavía no consta ninguna exportación desde este navegador.'} Recibirás un recordatorio en la pantalla principal cada 7 días si hay magos inscritos y no has exportado una copia.</p><div style="height:10px"></div><button class="btn full" data-act="import">⬆ Importar una copia (.json)</button><input type="file" id="importFile" accept=".json,application/json" hidden><p class="notice">La importación sustituye los datos actuales después de pedir confirmación. Haz antes una exportación.</p></div><div class="panel"><h3>Información</h3><p>Versión de la aplicación: 1.1.1 · recordatorios de copias<br>Formato de datos: ${SCHEMA}<br>Magos: ${db.magos.length} · Sorteos: ${db.sorteos.length} · Misiones: ${db.misiones.length}</p><p class="notice">Aplicación sin conexión ni cuentas. Úsala solo en un dispositivo privado y protegido, conforme a las normas del colegio sobre datos de menores.</p></div>`}
a.innerHTML=html+'<div class="foot">✦ Club de Magia Josefina Carabias ✦<br>Datos guardados en este dispositivo</div>';if(page==='magos'){const inp=$('search');inp.addEventListener('input',()=>{search=inp.value;drawMagos()});drawMagos()}bind();}
function drawMagos(){let list=$('mago-list');if(!list)return;let arr=db.magos.filter(m=>(m.nombre+' '+(m.clase||'')).toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es'))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));list.innerHTML=arr.length?arr.map(m=>`<div class="item clickitem" data-open-mago="${m.id}"><div class="between"><strong>${esc(m.nombre)}</strong><span class="pill">${(m.tasks||[]).filter(Boolean).length}/3 ★</span></div><div class="muted">${esc(m.clase||'Sin clase')} · ${esc(GRADES[m.grado]||GRADES[0])}</div></div>`).join(''):'<div class="empty">No hay magos que coincidan.</div>';list.querySelectorAll('[data-open-mago]').forEach(el=>el.onclick=()=>go('ficha',el.dataset.openMago))}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-open-sorteo]').forEach(el=>el.onclick=()=>go('sorteo',el.dataset.openSorteo));document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>action(el.dataset.act,el.dataset.id));if(page==='ficha'){let m=mago();$('carne').onchange=e=>{m.carne=e.target.checked;save()};document.querySelectorAll('[data-task]').forEach(el=>el.onchange=e=>{m.tasks[+el.dataset.task]=e.target.checked;save();render()})}if(page==='sorteo'){let s=db.sorteos.find(x=>x.id===selected);document.querySelectorAll('[data-part]').forEach(el=>el.onchange=e=>{s.participantes=updateSet(s.participantes,el.dataset.part,e.target.checked);s.ganadores=(s.ganadores||[]).filter(id=>s.participantes.includes(id));save();render()});document.querySelectorAll('[data-win]').forEach(el=>el.onchange=e=>{s.ganadores=updateSet(s.ganadores,el.dataset.win,e.target.checked);save();render()})}if(page==='ajustes')$('importFile').onchange=importFile}
function updateSet(arr,id,on){let a=new Set(arr||[]);on?a.add(id):a.delete(id);return [...a]}
function modal(title,content,onsubmit){$('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><div class="between"><h3>${esc(title)}</h3><button class="btn ghost smallbtn" id="closeModal">✕</button></div><form id="modalForm">${content}<div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn ghost" type="button" id="cancelModal">Cancelar</button></div></form></div></div>`;$('closeModal').onclick=$('cancelModal').onclick=closeModal;$('modalForm').onsubmit=e=>{e.preventDefault();onsubmit(new FormData(e.target))}}
function closeModal(){$('modalroot').innerHTML=''}
const field=(name,label,val='',type='text',required=false)=>`<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(val)}" ${required?'required':''}></div>`;
function action(act,id){let m=mago(),s=db.sorteos.find(x=>x.id===selected);
if(act==='addMago'||act==='editMago'){let old=act==='editMago'?m:null;modal(old?'Editar mago':'Añadir mago',field('nombre','Nombre del mago',old?.nombre||'','text',true)+field('clase','Clase (opcional)',old?.clase||'')+`<div class="field"><label>Grado actual</label><select name="grado">${GRADES.map((g,i)=>`<option value="${i}" ${old?.grado===i?'selected':''}>${esc(g)}</option>`).join('')}</select></div>`,f=>{let nombre=String(f.get('nombre')||'').trim();if(!nombre)return;let grado=+f.get('grado');if(old){Object.assign(old,{nombre,clase:String(f.get('clase')||'').trim(),grado})}else{db.magos.push({id:uid(),nombre,clase:String(f.get('clase')||'').trim(),grado,carne:false,tasks:[false,false,false],trucos:[],historial:[],notas:''})}save();closeModal();render()});return}
if(act==='deleteMago'){if(!m)return;const message='¿Eliminar definitivamente a '+m.nombre+'?\n\nSe borrarán su ficha, sus trucos, estrellas, observaciones e historial de ascensos. También dejará de figurar en los sorteos.\n\nEsta acción no se puede deshacer salvo importando una copia de seguridad. Es recomendable exportar una copia antes.';if(!confirm(message))return;const oldDb=JSON.parse(JSON.stringify(db));db.magos=db.magos.filter(x=>x.id!==m.id);db.sorteos.forEach(x=>{x.participantes=(x.participantes||[]).filter(v=>v!==m.id);x.ganadores=(x.ganadores||[]).filter(v=>v!==m.id)});if(!save()){db=oldDb;return}go('magos');return}
if(act==='saveNotas'){m.notas=$('notasMago').value;save();alert('Observaciones guardadas.');return}
if(act==='ascender'){if(m.grado>=4||m.tasks.filter(Boolean).length!==3)return;if(!confirm('¿Confirmas el ascenso de '+m.nombre+' al siguiente grado? Se guardará el historial y se reiniciarán las tres estrellas.'))return;m.grado++;m.historial.push({grado:m.grado,fecha:today(),pruebas:TASKS.slice()});m.tasks=[false,false,false];save();render();return}
if(act==='addTruco'||act==='editTruco'){let t=act==='editTruco'?m.trucos.find(x=>x.id===id):null;modal(t?'Editar truco':'Registrar truco',field('nombre','Nombre del truco',t?.nombre||'','text',true)+field('fecha','Fecha',t?.fecha||today(),'date')+`<div class="field"><label>Resultado</label><select name="resultado"><option ${t?.resultado==='Superado'?'selected':''}>Superado</option><option ${t?.resultado==='En práctica'?'selected':''}>En práctica</option><option ${t?.resultado==='Pendiente de repetir'?'selected':''}>Pendiente de repetir</option></select></div><div class="field"><label>Observaciones (opcional)</label><textarea name="notas">${esc(t?.notas||'')}</textarea></div>${t?'<button class="btn danger smallbtn" type="button" id="deleteTruco">Eliminar este truco</button>':''}`,f=>{let v={nombre:String(f.get('nombre')).trim(),fecha:String(f.get('fecha')),resultado:String(f.get('resultado')),notas:String(f.get('notas')).trim()};if(!v.nombre)return;if(t)Object.assign(t,v);else m.trucos.push({id:uid(),...v});save();closeModal();render()});if(t)$('deleteTruco').onclick=()=>{if(confirm('¿Eliminar este truco?')){m.trucos=m.trucos.filter(x=>x.id!==id);save();closeModal();render()}};return}
if(act==='addSorteo'||act==='editSorteo'){let old=act==='editSorteo'?s:null;modal(old?'Editar sorteo':'Nuevo sorteo',field('nombre','Nombre del sorteo',old?.nombre||'','text',true)+field('fecha','Fecha',old?.fecha||today(),'date')+field('premio','Premio o artilugio',old?.premio||'','text',true),f=>{let v={nombre:String(f.get('nombre')).trim(),fecha:String(f.get('fecha')),premio:String(f.get('premio')).trim()};if(!v.nombre||!v.premio)return;if(old)Object.assign(old,v);else db.sorteos.push({id:uid(),...v,participantes:[],ganadores:[],realizado:false});save();closeModal();render()});return}
if(act==='deleteSorteo'){if(confirm('¿Eliminar este sorteo y su historial de ganadores?')){db.sorteos=db.sorteos.filter(x=>x.id!==s.id);save();go('sorteos')}return}
if(act==='toggleSorteo'){s.realizado=!s.realizado;save();render();return}
if(act==='randomWin'){let ids=s.participantes||[];if(!ids.length)return;if(!confirm('¿Elegir al azar un ganador entre los '+ids.length+' participantes?'))return;let random=new Uint32Array(1);crypto.getRandomValues(random);let winner=ids[random[0]%ids.length];s.ganadores=[winner];save();render();alert('Ganador: '+(db.magos.find(x=>x.id===winner)?.nombre||'Desconocido'));return}
if(act==='addMision'||act==='editMision'){let old=act==='editMision'?db.misiones.find(x=>x.id===id):null;modal(old?'Editar misión':'Nueva misión',field('nombre','Nombre de la misión',old?.nombre||'','text',true)+field('fecha','Fecha',old?.fecha||today(),'date')+`<div class="field"><label>Descripción</label><textarea name="descripcion">${esc(old?.descripcion||'')}</textarea></div>`,f=>{let v={nombre:String(f.get('nombre')).trim(),fecha:String(f.get('fecha')),descripcion:String(f.get('descripcion')).trim()};if(!v.nombre)return;if(old)Object.assign(old,v);else db.misiones.push({id:uid(),...v});save();closeModal();render()});return}
if(act==='deleteMision'){if(confirm('¿Eliminar esta misión?')){db.misiones=db.misiones.filter(x=>x.id!==id);save();render()}return}
if(act==='export'){let backup={app:'Club de Magia Josefina Carabias',schemaVersion:SCHEMA,exportadoEn:new Date().toISOString(),datos:db};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='club-magia-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem(BACKUP_DATE_KEY,String(Date.now()))}catch(e){}setTimeout(()=>URL.revokeObjectURL(url),3000);if(page==='ajustes'||page==='home')render();return}
if(act==='import'){$('importFile').click();return}}
async function importFile(e){let file=e.target.files[0];if(!file)return;try{if(file.size>10_000_000)throw Error('Archivo demasiado grande');let obj=JSON.parse(await file.text()),d=obj.datos||obj;if(!d||!Array.isArray(d.magos)||!Array.isArray(d.sorteos)||!Array.isArray(d.misiones))throw Error('El archivo no contiene una copia válida');let ver=Number(obj.schemaVersion??d.schemaVersion??1);if(ver>SCHEMA)throw Error('Esta copia pertenece a una versión más reciente. No se puede importar de forma segura.');if(!d.magos.every(m=>typeof m.id==='string'&&typeof m.nombre==='string'&&Array.isArray(m.trucos)))throw Error('Hay fichas incompletas o incompatibles');if(!confirm(`Se importarán ${d.magos.length} magos y ${d.sorteos.length} sorteos. Esto REEMPLAZARÁ los datos actuales. ¿Continuar?`))return;let prev=db;db={schemaVersion:SCHEMA,magos:d.magos,sorteos:d.sorteos,misiones:d.misiones};if(!save()){db=prev;return}alert('Copia importada correctamente.');go('home')}catch(err){alert('No se ha podido importar: '+err.message)}finally{e.target.value=''}}
render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }
</script></body></html>
